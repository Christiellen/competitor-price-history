# Sem segredos: tudo vem de variáveis de ambiente.
# Rode o dbt a partir desta pasta (dbt/) ou use DBT_PROFILES_DIR=dbt.
price_history:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth                      # gcloud auth application-default login
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_DATASET', 'dev') }}"
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
      # trava de custo: nenhuma consulta pode processar mais de 10 GB
      maximum_bytes_billed: 10000000000

    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_CI_DATASET', 'ci') }}"
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 10000000000

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: analytics
      location: "{{ env_var('GCP_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 600
      maximum_bytes_billed: 10000000000
