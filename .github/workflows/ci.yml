name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Testes do gerador (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.txt
      - run: pip install -r ingestion/requirements-dev.txt
      - run: pytest -q ingestion/tests

  dbt_static:
    name: dbt parse (sem warehouse)
    # roda sempre, mesmo sem projeto GCP: valida Jinja, refs, YAML, contracts
    # declarados, snapshots, exposures e a camada semântica (MetricFlow)
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ci-parse-only
      DBT_PROFILES_DIR: .
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-bigquery>=1.10,<2"
      - run: dbt deps
      - run: dbt parse --no-partial-parse --warn-error

  dbt:
    name: dbt build em dataset temporário
    runs-on: ubuntu-latest
    needs: [python, dbt_static]
    # só roda quando a service account foi configurada no repositório
    if: ${{ vars.GCP_PROJECT != '' }}
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION || 'US' }}
      DBT_TARGET: ci
      DBT_PROFILES_DIR: .
      # um dataset por PR (ou por execução na main), apagado no final
      DBT_CI_DATASET: ci_${{ github.event.pull_request.number || github.run_id }}
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Instalar dbt
        run: pip install "dbt-bigquery>=1.10,<2"

      - run: dbt deps

      - name: dbt build (modelos + testes)
        # carga completa em dataset isolado: valida SQL, incremental e testes
        # contra os dados reais do dataset raw
        run: dbt build --fail-fast

      - name: Rodar os incrementais de novo
        # a segunda execução passa pelo caminho is_incremental() e reescreve só
        # as partições afetadas; os testes confirmam que o grão continua único
        run: dbt build --select fct_fare_capture+ --fail-fast

      - name: Apagar datasets temporários
        if: always()
        run: |
          for ds in $(bq ls --project_id="$GCP_PROJECT" --format=json | python -c "import json,sys,os; p=os.environ['DBT_CI_DATASET']; print(' '.join(d['datasetReference']['datasetId'] for d in json.load(sys.stdin) if d['datasetReference']['datasetId'] == p or d['datasetReference']['datasetId'].startswith(p + '_')))"); do
            echo "Apagando $ds"
            bq rm -r -f -d "$GCP_PROJECT:$ds"
          done
